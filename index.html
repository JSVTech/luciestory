    html,
    body {

        line-height: 0;
        user-select: none;
    }

        width: 100%;
        height: auto;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
    }

        position: absolute;
        inset: 0;
        z-index: 5;

    }

    .click-zone {

        cursor: pointer;
        background: rgba(255,255,255,0);
        border: none;
        padding: 0;
        margin: 0;
    }

    .click-zone:hover {
        background: rgba(255,255,255,.025);
    }

    body.debug .click-zone {

    }

        color: #fff;
        text-align: left;
    }

    .modal-title {

        font-weight: 800;
        font-size: 20px;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .modal-text {
        font-size: 20px;
        line-height: 1.6;
        white-space: pre-line;
    }

        background: #09121c;

/* ==========================================================
   STAV HRY
   ========================================================== */

function freshState() {
    return {
        scene: "d1",

        closeness: 0,
        trust: 0,
        independence: 0,
        relationship: 0,
        situationship: 0,
        jardaUncertainty: 0,

        chapter5Relationship: null,
        chapter6Relationship: null,

        history: []
    };
}

let state = freshState();


/* ==========================================================
   HELPERY
   ========================================================== */

function effect(values = {}) {

    for (const [key, value] of Object.entries(values)) {

        if (
            typeof value === "number" &&
            typeof state[key] === "number"
        ) {
            state[key] += value;
        }

        else {
            state[key] = value;
        }
    }

    saveGame();
}


function remember(scene, choice) {
    state.history.push({
        scene,
        choice
    });

    saveGame();
}


function saveGame() {
    localStorage.setItem(
        "lucieStorySave",
        JSON.stringify(state)
    );
}


function loadGame() {

    const raw = localStorage.getItem("lucieStorySave");

    if (!raw) return;

    try {

        const parsed = JSON.parse(raw);

        if (parsed && parsed.scene) {
            state = {
                ...freshState(),
                ...parsed
            };
        }

    } catch (e) {
        console.warn("Save se nepodařilo načíst.");
    }
}


function goto(sceneId) {

    if (!scenes[sceneId]) {
        console.error("Scéna neexistuje:", sceneId);
        return;
    }

    state.scene = sceneId;
    saveGame();
    renderScene();
}


function restartGame() {

    if (!confirm("Opravdu chceš začít úplně od začátku?")) {
        return;
    }

    state = freshState();
    saveGame();

    hideModal();
    hideEnding();
    hideChapter();

    goto("d1");
}


function toggleDebug() {
    document.body.classList.toggle("debug");
}


/* ==========================================================
   TEXTOVÝ POPUP
   ========================================================== */

function showModal(text, nextScene, title = "Vypravěč") {

    const layer = document.getElementById("modal-layer");
    const titleEl = document.getElementById("modal-title");
    const textEl = document.getElementById("modal-text");
    const button = document.getElementById("modal-button");

    titleEl.textContent = title;
    textEl.textContent = text;

    layer.classList.add("show");

    button.onclick = () => {

        hideModal();

        if (nextScene) {
            goto(nextScene);
        }
    };
}


function hideModal() {
    document
        .getElementById("modal-layer")
        .classList.remove("show");
}


/* ==========================================================
   GAME OVER
   ========================================================== */

function showEnding(title, text) {

    document.getElementById("ending-title").textContent = title;
    document.getElementById("ending-text").textContent = text;

    document
        .getElementById("ending-layer")
        .classList.add("show");
}


function hideEnding() {
    document
        .getElementById("ending-layer")
        .classList.remove("show");
}


document.getElementById("ending-restart").onclick = () => {

    state = freshState();
    saveGame();

    hideEnding();

    goto("d1");
};


/* ==========================================================
   KONEC KAPITOLY
   ========================================================== */

function showChapterEnd(title, text, nextScene) {

    document.getElementById("chapter-title").textContent = title;
    document.getElementById("chapter-text").textContent = text;

    const layer = document.getElementById("chapter-layer");
    const button = document.getElementById("chapter-button");

    layer.classList.add("show");

    button.onclick = () => {

        hideChapter();

        if (nextScene) {
            goto(nextScene);
        }
    };
}


function hideChapter() {
    document
        .getElementById("chapter-layer")
        .classList.remove("show");
}


/* ==========================================================
   AKCE
   ========================================================== */

function go(next, values = {}, choiceName = "") {

    if (choiceName) {
        remember(state.scene, choiceName);
    }

    effect(values);

    goto(next);
}


function popup(
    text,
    next,
    values = {},
    choiceName = ""
) {

    if (choiceName) {
        remember(state.scene, choiceName);
    }

    effect(values);

    showModal(text, next);
}


function gameOver(
    title,
    text,
    values = {},
    choiceName = ""
) {

    if (choiceName) {
        remember(state.scene, choiceName);
    }

    effect(values);

    showEnding(title, text);
}

/* ==========================================================
   RENDER
   ========================================================== */

const sceneImage =
    document.getElementById("scene-image");

const clickLayer =
    document.getElementById("click-layer");


function createZone(zone, action) {

    const button = document.createElement("button");

    button.className = "click-zone";

    button.style.left =
        zone.left + "%";

    button.style.top =
        zone.top + "%";

    button.style.width =
        zone.width + "%";

    button.style.height =
        zone.height + "%";

    button.setAttribute(
        "aria-label",
        "Volba"
    );

    button.onclick = event => {

        event.preventDefault();
        event.stopPropagation();

        if (typeof action === "function") {
            action();
        }
    };

    clickLayer.appendChild(button);
}


function renderScene() {

    hideModal();
    hideEnding();
    hideChapter();

    const scene = scenes[state.scene];

    if (!scene) {
        console.error("Nenalezena scéna:", state.scene);
        return;
    }

    clickLayer.innerHTML = "";

    sceneImage.src =
        asset(scene.image);

    sceneImage.alt =
        `LucieStory – ${state.scene}`;

    for (const item of scene.zones || []) {
        createZone(
            item.zone,
            item.action
        );
    }
}


/* ==========================================================
   OCHRANA PROTI STARÉMU CACHE
   ========================================================== */

sceneImage.onerror = function() {

    console.error(
        "Nepodařilo se načíst:",
        this.src
    );
};

/* ==========================================================

loadGame();

if (!scenes[state.scene]) {
    state.scene = "d1";
}

renderScene();
