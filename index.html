<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lucčin příběh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05070b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 14px;

      gap: 10px;
    }


    /* =========================
       HORNÍ LIŠTA
    ========================== */

    .topbar {
      width: min(1536px, 100%);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      flex-wrap: wrap;
    }

    .title {
      font-size: 21px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 3px;

      color: #9ca3af;

      font-size: 13px;
    }

    .debug-btn {
      border: 1px solid #374151;

      background: #111827;
      color: white;

      padding: 9px 13px;

      border-radius: 9px;

      cursor: pointer;
    }

    .debug-btn:hover {
      background: #1f2937;
    }


    /* =========================
       HERNÍ PLOCHA
    ========================== */

    .stage {
      position: relative;

      width: min(1536px, 100%);

      aspect-ratio: 3 / 2;

      background: black;

      overflow: hidden;

      border-radius: 14px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.5);
    }


    /* =========================
       OBRÁZEK
    ========================== */

    #sceneImage {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      user-select: none;

      -webkit-user-drag: none;

      background: black;
    }


    /* =========================
       KLIKACÍ ZÓNY
    ========================== */

    #overlay {
      position: absolute;

      inset: 0;

      z-index: 10;
    }

    .zone {
      position: absolute;

      border: 0;

      margin: 0;
      padding: 0;

      background: transparent;

      cursor: pointer;
    }

    .zone.debug {
      outline: 3px dashed red;

      background:
        rgba(255,0,0,.17);
    }


    /* =========================
       START / END SCREEN
    ========================== */

    .panel {
      position: absolute;

      inset: 0;

      z-index: 30;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 25px;

      background:
        rgba(4,7,15,.88);

      text-align: center;

      backdrop-filter: blur(5px);
    }

    .panel.hidden {
      display: none;
    }

    .panel-box {
      width: min(700px, 100%);

      padding: 30px;

      border-radius: 16px;

      border:
        1px solid rgba(255,255,255,.13);

      background:
        rgba(10,15,28,.94);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);
    }

    .panel-box h1 {
      margin: 0 0 14px;

      font-size:
        clamp(32px, 6vw, 64px);
    }

    .panel-box p {
      margin: 0;

      color: #d1d5db;

      font-size: 17px;

      line-height: 1.6;
    }

    .panel-actions {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 24px;
    }

    .panel-actions button {
      border: 0;

      border-radius: 11px;

      padding: 14px 21px;

      cursor: pointer;

      font-size: 16px;

      font-weight: bold;
    }

    .primary {
      background: #f3d56b;

      color: #111;
    }

    .secondary {
      background: #1f2937;

      color: white;

      border:
        1px solid #374151 !important;
    }


    /* =========================
       DEBUG TEXT
    ========================== */

    .hint {
      width: min(1536px, 100%);

      color: #6b7280;

      font-size: 12px;

      text-align: center;
    }


    /* =========================
       MOBIL
    ========================== */

    @media (max-width: 700px) {

      .app {
        padding: 5px;
      }

      .topbar {
        padding: 4px;
      }

      .title {
        font-size: 16px;
      }

      .subtitle {
        font-size: 11px;
      }

      .debug-btn {
        font-size: 11px;

        padding: 7px 9px;
      }

      .stage {
        border-radius: 7px;
      }

      .hint {
        display: none;
      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- =========================
       HORNÍ LIŠTA
  ========================== -->

  <div class="topbar">

    <div>
      <div class="title">
        Lucčin příběh
      </div>

      <div class="subtitle">
        Kapitola 1 – Dýmkárna
      </div>
    </div>


    <button
      class="debug-btn"
      id="debugBtn"
      type="button"
    >
      Debug zóny: vypnuto
    </button>

  </div>



  <!-- =========================
       HRA
  ========================== -->

  <div class="stage">


    <img
      id="sceneImage"
      src="assets/d1.png"
      alt="Scéna hry"
    >


    <div id="overlay"></div>



    <!-- =========================
         START SCREEN
    ========================== -->

    <div
      class="panel"
      id="startScreen"
    >

      <div class="panel-box">

        <h1>
          Lucčin příběh
        </h1>

        <p>
          Jeden večer.
          <br>
          Několik rozhodnutí.
          <br>
          A spousta možností, jak mohl příběh pokračovat.
        </p>

        <div class="panel-actions">

          <button
            class="primary"
            id="startBtn"
            type="button"
          >
            Začít příběh
          </button>

        </div>

      </div>

    </div>



    <!-- =========================
         END SCREEN
    ========================== -->

    <div
      class="panel hidden"
      id="endScreen"
    >

      <div class="panel-box">

        <h1 id="endTitle">
          Konec
        </h1>

        <p id="endText"></p>


        <div class="panel-actions">

          <button
            class="primary"
            id="restartBtn"
            type="button"
          >
            Hrát od začátku
          </button>


          <button
            class="secondary"
            id="closeEndBtn"
            type="button"
          >
            Zpět
          </button>

        </div>

      </div>

    </div>


  </div>


  <div class="hint">
    Klávesou D nebo tlačítkem Debug můžeš zobrazit klikací oblasti.
  </div>

</div>

          ...ZONES.choiceMiddle,

        },


        {

          ...ZONES.choiceRight,

        {

        },


        {

          ...ZONES.choiceMiddle,

        {

        {

        {

            loadScene("d6");

          }

        }

      ]

    },



    /* ROMANTICKÝ KONEC VEČERA */

    d8: {

      image: "assets/d8.png",

      subtitle:

      zones: [

        {

          action: () => {

    /* CHLADNĚJŠÍ KONEC */

    /* MESSENGER */

    d10: {

    /* ===================================================
       KAPITOLA 2

      zones: [

        {

          ...ZONES.choiceLeft,

          action: () => {

            state.closeness += 1;

            state.trust += 1;

            loadScene("p2");

          }

        },


        {

          ...ZONES.choiceMiddle,

          action: () => {

            state.trust += 1;

            state.independence += 1;

            loadScene("p2");

          }

        },


        {

          ...ZONES.choiceRight,

          action: () => {

            state.closeness += 1;

            state.relationship += 1;

            loadScene("p2");

          }

        }

      ]

    },



    /* ORLEN + KÁVA */

    p2: {

      image: "assets/p2.png",

      subtitle:
        "Kapitola 2 – ORLEN",

      zones: [

        {

          ...ZONES.choiceLeft,

          action: () => {

            state.trust += 1;

            state.closeness += 1;

            loadScene("p3");

          }

        },


        {

          ...ZONES.choiceMiddle,

          action: () => {

            state.trust += 2;

            state.relationship += 1;

            loadScene("p3");

          }

        },


        {

          ...ZONES.choiceRight,

          action: () => {

            state.closeness += 2;

            state.relationship += 2;

            loadScene("p3");

          }

        }

      ]

    },



    /* DELŠÍ POVÍDÁNÍ */

    p3: {

      image: "assets/p3.png",

      subtitle:
        "Kapitola 2 – První schůzka",

      zones: [

        {

          ...ZONES.choiceLeft,

          action: () => {

            loadScene("p4");

          }

        },


        {

          ...ZONES.choiceMiddle,

          action: () => {

            state.trust += 3;

            state.relationship += 1;

            loadScene("p4");

          }

        },


        {

          ...ZONES.choiceRight,

          action: () => {

            state.closeness += 2;

            state.relationship += 2;

            loadScene("p4");

          }

        }

      ]

    },



    /* MONTÁŽ – ZAČALI SE VÍDAT */

      subtitle:

      zones: [

        {

          action: () => {

            state.trust += 1;

            loadScene("p5");

          }

        }

      ]

    },



    /* TATARÁK + VÍNO */

    p5: {

      image: "assets/p5.png",

      subtitle:
        "Kapitola 2 – Náš malý rituál",

      zones: [

        {

          ...ZONES.choiceLeft,

          action: () => {

            state.trust += 1;

            state.closeness += 1;

            loadScene("p6");

          }

        },


        {

          ...ZONES.choiceMiddle,

          action: () => {

            state.closeness += 2;

            state.relationship += 2;

            loadScene("p6");

          }

        },


        {

          ...ZONES.choiceRight,

          action: () => {

            state.closeness += 3;

            state.relationship += 2;

            loadScene("p6");

          }

        }

      ]

    },



    /* PO VEČEŘI V AUTĚ */

    p6: {

      image: "assets/p6.png",

      subtitle:
        "Kapitola 2 – Večer ještě nekončí",

      zones: [

        {

          ...ZONES.choiceLeft,

          action: () => {

            state.closeness += 2;

            state.relationship += 1;

            loadScene("p7");

          }

        },


        {

          ...ZONES.choiceMiddle,

          action: () => {

            state.trust += 2;

            state.closeness += 1;

            loadScene("p7");

        },


        {

          ...ZONES.choiceRight,

          action: () => {

            state.relationship += 2;

            state.closeness += 2;

            loadScene("p7");

          }

      ]

    },



    /* HŘBITOV */

    p7: {

      image: "assets/p7.png",

      subtitle:
        "Kapitola 2 – Noční zastávka",

      zones: [

        {

          ...ZONES.choiceLeft,

          action: () => {

            state.closeness += 2;

            state.relationship += 1;

            loadScene("p8");

          }

        },


        {

          ...ZONES.choiceMiddle,

          action: () => {

            state.closeness += 3;

            state.relationship += 2;

          }

        },


        {

          ...ZONES.choiceRight,

          action: () => {

            state.trust += 1;

            state.closeness += 2;

            loadScene("p8");

          }

        }

      ]

    /* ZAMLŽENÁ OKNA */

    p8: {

      image: "assets/p8.png",

      subtitle:

      zones: [

        {

          ...ZONES.continueCenter,

          action: () => {

            state.closeness += 2;

            state.relationship += 1;

            loadScene("p9");

          }

      ]

    /* KONEC KAPITOLY */

    p9: {

      image: "assets/p9.png",

      subtitle:
        "Konec kapitoly 2",

      zones: [

        {

          ...ZONES.chapterButton,

          action: () => {

            showEnding(

              "KAPITOLA 3 ODEMČENA",

              "Z pravidelných večerů se pomalu stává něco víc. Další kapitola začne prvním společným přespáním v Boskovicích."

            );

          }

        }

      ]

    }

  };



  /* =====================================================
     VYTVOŘENÍ KLIKACÍ ZÓNY
  ===================================================== */

  function applyZoneStyle(
    element,
    zone
  ) {

    element.style.left =
      zone.left + "%";

    element.style.top =
      zone.top + "%";

    element.style.width =
      zone.width + "%";

    element.style.height =
      zone.height + "%";

  }



  /* =====================================================
     VYKRESLENÍ ZÓN
  ===================================================== */

  function renderZones(
    zoneList
  ) {

    overlay.innerHTML = "";


    zoneList.forEach(zone => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "zone";


      if (debug) {

        button.classList.add(
          "debug"
        );

      }


      applyZoneStyle(
        button,
        zone
      );


      button.addEventListener(
        "click",
        zone.action
      );


      overlay.appendChild(
        button
      );

    });

  }



  /* =====================================================
     NAČTENÍ SCÉNY
  ===================================================== */

  function loadScene(
    sceneKey
  ) {

    const scene =
      scenes[sceneKey];


    if (!scene) {

      console.error(
        "Scéna neexistuje:",
        sceneKey
      );

      return;

    }


    currentScene =
      sceneKey;


    sceneImage.src =
      scene.image;


    subtitleEl.textContent =
      scene.subtitle ||
      "Lucčin příběh";


    renderZones(
      scene.zones
    );

  }



  /* =====================================================
     KONEC / PŘECHOD
  ===================================================== */

  function showEnding(
    title,
    text
  ) {

    endTitle.textContent =
      title;


    endText.textContent =
      text;


    endScreen.classList.remove(
      "hidden"
    );

  }



  /* =====================================================
     RESET
  ===================================================== */

  function restartGame() {

    state.closeness = 0;

    state.trust = 0;

    state.independence = 0;

    state.relationship = 0;


    currentScene = "d1";


    endScreen.classList.add(
      "hidden"
    );


    startScreen.classList.remove(
      "hidden"
    );


    overlay.innerHTML = "";


    sceneImage.src =
      "assets/d1.png";


    subtitleEl.textContent =
      "Kapitola 1 – Dýmkárna";

  }



  /* =====================================================
     START BUTTON
  ===================================================== */

  document
    .getElementById("startBtn")
    .addEventListener(
      "click",
      () => {

        startScreen.classList.add(
          "hidden"
        );

        loadScene(
          "d1"
        );

      }
    );



  /* =====================================================
     RESTART
  ===================================================== */

  restartBtn.addEventListener(
    "click",
    restartGame
  );



  /* =====================================================
     ZAVŘÍT END PANEL
  ===================================================== */

  closeEndBtn.addEventListener(
    "click",
    () => {

      endScreen.classList.add(
        "hidden"
      );

    }
  );



  /* =====================================================
     DEBUG
  ===================================================== */

  function refreshDebugState() {

    debugBtn.textContent =
      debug
      ? "Debug zóny: zapnuto"
      : "Debug zóny: vypnuto";


    document
      .querySelectorAll(".zone")
      .forEach(zone => {

        zone.classList.toggle(
          "debug",
          debug
        );

      });

  }


  debugBtn.addEventListener(
    "click",
    () => {

      debug =
        !debug;

      refreshDebugState();

    }
