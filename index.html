<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lucčin příběh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05070b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 10px;
    }

    .topbar {
      width: min(1672px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #9ca3af;
    }

    .debug-btn {
      border: 1px solid #374151;
      background: #111827;
      color: white;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    .debug-btn:hover {
      background: #1f2937;
    }

    .stage {
      position: relative;
      width: min(1672px, 100%);
      overflow: hidden;
      border-radius: 12px;
      background: black;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    #sceneImage {
      display: block;
      width: 100%;
      height: auto;
      background: black;
      user-select: none;
      -webkit-user-drag: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .zone {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .zone.debug {
      outline: 3px dashed red;
      background: rgba(255, 0, 0, .22);
    }

    .panel {
      position: absolute;
      inset: 0;
      z-index: 40;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      background: rgba(3, 6, 15, .88);
      backdrop-filter: blur(5px);

      text-align: center;
    }

    .panel.hidden {
      display: none;
    }

    .panel-box {
      width: min(720px, 100%);
      padding: 30px;

      background: rgba(9, 14, 27, .97);

      border: 2px solid #36b8ff;
      border-radius: 14px;

      box-shadow:
        0 20px 70px rgba(0, 0, 0, .65),
        0 0 25px rgba(54, 184, 255, .12);
    }

    .panel-box h1 {
      margin: 0 0 16px;
      font-size: clamp(30px, 5vw, 58px);
    }

    .panel-box h2 {
      margin: 0 0 14px;
      font-size: clamp(23px, 4vw, 38px);
      color: #ff70bd;
    }

    .panel-box p {
      margin: 0;
      color: #d8dee9;
      font-size: 18px;
      line-height: 1.65;
    }

    .panel-actions {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-actions button {
      padding: 14px 22px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      border: 1px solid #e5cf58;
      background: #e5cf58;
      color: #111827;
    }

    .secondary {
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
    }

    .hint {
      width: min(1672px, 100%);
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    @media (max-width: 700px) {
      .app {
        padding: 4px;
      }

      .topbar {
        padding: 4px;
      }

      .title {
        font-size: 16px;
      }

      .subtitle {
        font-size: 11px;
      }

      .debug-btn {
        padding: 7px 9px;
        font-size: 11px;
      }

      .stage {
        border-radius: 5px;
      }

      .hint {
        display: none;
      }

      .panel-box {
        padding: 20px;
      }

      .panel-box p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">

    <div>
      <div class="title">Lucčin příběh</div>

      <div
        class="subtitle"
        id="subtitle"
      >
        Kapitola 1 – Dýmkárna
      </div>
    </div>

    <button
      class="debug-btn"
      id="debugBtn"
      type="button"
    >
      Debug zóny: vypnuto
    </button>

  </div>


  <div class="stage">

    <img
      id="sceneImage"
      src="assets/d1.png?v=40"
      alt="Scéna hry"
    >

    <div id="overlay"></div>


    <!-- START -->

    <div
      class="panel"
      id="startScreen"
    >
      <div class="panel-box">

        <h1>Lucčin příběh</h1>

        <p>
          Jeden příběh.<br>
          Spousta rozhodnutí.<br>
          A několik možností, kam může všechno dojít.
        </p>

        <div class="panel-actions">

          <button
            class="primary"
            id="startBtn"
            type="button"
          >
            Začít příběh
          </button>

        </div>

      </div>
    </div>


    <!-- MEZITEXT -->

    <div
      class="panel hidden"
      id="interludeScreen"
    >
      <div class="panel-box">

        <h2 id="interludeTitle">
          Vypravěč
        </h2>

        <p id="interludeText"></p>

        <div class="panel-actions">

          <button
            class="primary"
            id="interludeContinue"
            type="button"
          >
            Pokračovat
          </button>

        </div>

      </div>
    </div>


    <!-- GAME OVER -->

    <div
      class="panel hidden"
      id="endScreen"
    >
      <div class="panel-box">

        <h1 id="endTitle">
          Konec
        </h1>

        <p id="endText"></p>

        <div class="panel-actions">

          <button
            class="primary"
            id="restartBtn"
            type="button"
          >
            Hrát od začátku
          </button>

          <button
            class="secondary"
            id="closeEndBtn"
            type="button"
          >
            Zpět
          </button>

        </div>

      </div>
    </div>


    <!-- KONEC AKTUÁLNÍ KAPITOLY -->

    <div
      class="panel hidden"
      id="chapterEndScreen"
    >
      <div class="panel-box">

        <h1 id="chapterEndTitle">
          Konec kapitoly
        </h1>

        <p id="chapterEndText"></p>

        <div class="panel-actions">

          <button
            class="primary"
            id="chapterEndClose"
            type="button"
          >
            Pokračování příště
          </button>

        </div>

      </div>
    </div>

  </div>


  <div class="hint">
    Klávesa D zapne nebo vypne debug klikacích zón.
  </div>

</div>

  /*
  ============================================================
  FUNKCE
  ============================================================
  */


  function applyZoneStyle(
    element,
    zone
  ) {

    element.style.left =
      zone.left + "%";

    element.style.top =
      zone.top + "%";

    element.style.width =
      zone.width + "%";

    element.style.height =
      zone.height + "%";

  }


  function renderZones(
    zoneList
  ) {

    overlay.innerHTML = "";

    zoneList.forEach(
      zone => {

        const button =
          document.createElement("button");

        button.type =
          "button";

        button.className =
          "zone";

        if (debug) {

          button.classList.add(
            "debug"
          );

        }

        applyZoneStyle(
          button,
          zone
        );

        button.addEventListener(
          "click",
          zone.action
        );

        overlay.appendChild(
          button
        );

      }
    );

  }


  function loadScene(
    sceneKey
  ) {

    const scene =
      scenes[sceneKey];

    if (!scene) {

      console.error(
        "Scéna neexistuje:",
        sceneKey
      );

      return;

    }

    currentScene =
      sceneKey;

    sceneImage.src =
      scene.image +
      "?v=" +
      ASSET_VERSION;

    subtitle.textContent =
      scene.subtitle;

    renderZones(
      scene.zones
    );

  }


  /*
  ============================================================
  MEZITEXT
  ============================================================
  */


  function showInterlude(
    title,
    text,
    nextScene
  ) {

    interludeTitle.textContent =
      title;

    interludeText.textContent =
      text;

    interludeNextScene =
      nextScene;

    interludeScreen
      .classList
      .remove("hidden");

  }


  interludeContinue
    .addEventListener(
      "click",
      () => {

        interludeScreen
          .classList
          .add("hidden");

        if (interludeNextScene) {

          const next =
            interludeNextScene;

          interludeNextScene =
            null;

          loadScene(next);

        }

      }
    );


  /*
  ============================================================
  GAME OVER
  ============================================================
  */


  function showEnding(
    title,
    text
  ) {

    endTitle.textContent =
      title;

    endText.textContent =
      text;

    endScreen
      .classList
      .remove("hidden");

  }


  /*
  ============================================================
  KONEC KAPITOLY
  ============================================================

  function showChapterEnd(
    title,

  ) {

    chapterEndTitle.textContent =
      title;

    chapterEndText.textContent =
      text;

    chapterEndScreen
      .classList
      .remove("hidden");
