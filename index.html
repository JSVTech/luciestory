<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lucčin příběh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05070b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 12px;

      gap: 10px;
    }

    /* =========================
       HORNÍ LIŠTA
    ========================== */

    .topbar {
      width: min(1672px, 100%);

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 3px;

      font-size: 13px;

      color: #9ca3af;
    }

    .debug-btn {
      border: 1px solid #374151;

      background: #111827;
      color: white;

      padding: 9px 13px;

      border-radius: 9px;

      cursor: pointer;
    }

    .debug-btn:hover {
      background: #1f2937;
    }

    /* =========================
       HERNÍ PLOCHA

       DŮLEŽITÉ:
       ŽÁDNÝ aspect-ratio.
       Výška se bere přímo z obrázku.
    ========================== */

    .stage {
      position: relative;

      width: min(1672px, 100%);

      background: black;

      overflow: hidden;

      border-radius: 12px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.5);
    }

    #sceneImage {
      position: relative;

      display: block;

      width: 100%;
      height: auto;

      background: black;

      user-select: none;

      -webkit-user-drag: none;
    }

    /* =========================
       KLIKACÍ VRSTVA

       Overlay je přesně stejně
       velký jako obrázek.
    ========================== */

    #overlay {
      position: absolute;

      inset: 0;

      z-index: 10;
    }

    .zone {
      position: absolute;

      border: 0;

      padding: 0;
      margin: 0;

      background: transparent;

      cursor: pointer;
    }

    .zone.debug {
      outline: 3px dashed #ff3030;

      background:
        rgba(255, 48, 48, .22);
    }

    /* =========================
       START / END
    ========================== */

    .panel {
      position: absolute;

      inset: 0;

      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      text-align: center;

      background:
        rgba(4,7,15,.9);

      backdrop-filter: blur(5px);
    }

    .panel.hidden {
      display: none;
    }

    .panel-box {
      width: min(700px, 100%);

      padding: 30px;

      border-radius: 16px;

      background:
        rgba(10,15,28,.96);

      border:
        1px solid rgba(255,255,255,.13);

      box-shadow:
        0 20px 60px rgba(0,0,0,.5);
    }

    .panel-box h1 {
      margin:
        0 0 14px;

      font-size:
        clamp(32px, 6vw, 64px);
    }

    .panel-box p {
      margin: 0;

      font-size: 17px;

      line-height: 1.6;

      color: #d1d5db;
    }

    .panel-actions {
      margin-top: 24px;

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    .panel-actions button {
      border: 0;

      padding:
        14px 21px;

      border-radius: 11px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .primary {
      background: #f3d56b;

      color: #111;
    }

    .secondary {
      background: #1f2937;

      color: white;

      border:
        1px solid #374151 !important;
    }

    .hint {
      width: min(1672px, 100%);

      text-align: center;

      font-size: 12px;

      color: #6b7280;
    }

    @media (max-width: 700px) {

      .app {
        padding: 4px;
      }

      .topbar {
        padding: 5px;
      }

      .title {
        font-size: 16px;
      }

      .subtitle {
        font-size: 11px;
      }

      .debug-btn {
        font-size: 11px;

        padding: 7px 9px;
      }

      .stage {
        border-radius: 6px;
      }

      .hint {
        display: none;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <!-- HORNÍ LIŠTA -->

  <div class="topbar">

    <div>

      <div class="title">
        Lucčin příběh
      </div>

      <div
        class="subtitle"
        id="subtitle"
      >
        Kapitola 1 – Dýmkárna
      </div>

    </div>

    <button
      class="debug-btn"
      id="debugBtn"
      type="button"
    >
      Debug zóny: vypnuto
    </button>

  </div>

  <!-- HRA -->

  <div class="stage">

    <img
      id="sceneImage"
      src="assets/d1.png?v=5"
      alt="Scéna hry"
    >

    <div id="overlay"></div>

    <!-- START -->

    <div
      class="panel"
      id="startScreen"
    >

      <div class="panel-box">

        <h1>
          Lucčin příběh
        </h1>

        <p>
          Jeden večer.
          <br>
          Několik rozhodnutí.
          <br>
          A spousta možností,
          jak mohl příběh pokračovat.
        </p>

        <div class="panel-actions">

          <button
            class="primary"
            id="startBtn"
            type="button"
          >
            Začít příběh
          </button>

        </div>

      </div>

    </div>

    <!-- END -->

    <div
      class="panel hidden"
      id="endScreen"
    >

      <div class="panel-box">

        <h1 id="endTitle">
          Konec
        </h1>

        <p id="endText"></p>

        <div class="panel-actions">

          <button
            class="primary"
            id="restartBtn"
            type="button"
          >
            Hrát od začátku
          </button>

          <button
            class="secondary"
            id="closeEndBtn"
            type="button"
          >
            Zpět
          </button>

        </div>

      </div>

    </div>

  </div>

  <div class="hint">
    Debug zobrazí červeně skutečná místa,
    na která jde kliknout.
  </div>

</div>


<script>

  /* =========================================
     NASTAVENÍ
  ========================================= */

  const ASSET_VERSION =
    "6";


  const sceneImage =
    document.getElementById(
      "sceneImage"
    );


  const overlay =
    document.getElementById(
      "overlay"
    );


  const debugBtn =
    document.getElementById(
      "debugBtn"
    );


  const startScreen =
    document.getElementById(
      "startScreen"
    );


  const endScreen =
    document.getElementById(
      "endScreen"
    );


  const endTitle =
    document.getElementById(
      "endTitle"
    );


  const endText =
    document.getElementById(
      "endText"
    );


  const restartBtn =
    document.getElementById(
      "restartBtn"
    );


  const closeEndBtn =
    document.getElementById(
      "closeEndBtn"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  let debug =
    false;


  let currentScene =
    "d1";


  /* =========================================
     SKRYTÉ HODNOTY
  ========================================= */

  const state = {

    closeness: 0,

    trust: 0,

    independence: 0,

    relationship: 0

  };


  /* =========================================
     KLIKACÍ ZÓNY
  ========================================= */

  const ZONES = {

    LEFT: {
      left: 2,
      top: 83,
      width: 31,
      height: 15
    },

    MIDDLE: {
      left: 34,
      top: 83,
      width: 32,
      height: 15
    },

    RIGHT: {
      left: 67,
      top: 83,
      width: 31,
      height: 15
    },

    CONTINUE_CENTER: {
      left: 30,
      top: 82,
      width: 40,
      height: 16
    },

    CONTINUE_RIGHT: {
      left: 70,
      top: 80,
      width: 29,
      height: 18
    },

    CHAPTER_CENTER: {
      left: 28,
      top: 83,
      width: 44,
      height: 15
    }

  };


  /* =========================================
     SCÉNY
  ========================================= */

  const scenes = {

    /* ======================================
       KAPITOLA 1 – DÝMKÁRNA
    ====================================== */

    d1: {
      image: "assets/d1.png",
      subtitle: "Kapitola 1 – Dýmkárna",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.closeness += 1;
            loadScene("d2");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.closeness += 2;
            state.relationship += 1;
            loadScene("d2");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.independence += 1;
            loadScene("d2");
          }
        }
      ]
    },

    d2: {
      image: "assets/d2.png",
      subtitle: "Kapitola 1 – Před záchody",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.closeness += 3;
            state.relationship += 2;
            state.trust += 1;
            loadScene("d3");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 1;
            loadScene("d4");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.independence += 3;
            state.relationship -= 2;
            loadScene("d7");
          }
        }
      ]
    },

    d3: {
      image: "assets/d3.png",
      subtitle: "Kapitola 1 – Před záchody",
      zones: [
        {
          ...ZONES.CONTINUE_RIGHT,
          action: () => {
            state.closeness += 2;
            loadScene("d5");
          }
        }
      ]
    },

    d4: {
      image: "assets/d4.png",
      subtitle: "Kapitola 1 – Před záchody",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.closeness += 3;
            state.relationship += 2;
            loadScene("d3");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 2;
            loadScene("d5");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.independence += 2;
            loadScene("d6");
          }
        }
      ]
    },

    d5: {
      image: "assets/d5.png",
      subtitle: "Kapitola 1 – U stolu",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.relationship += 3;
            state.trust += 2;
            loadScene("d8");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 1;
            state.independence += 1;
            loadScene("d9");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.independence += 3;
            state.relationship -= 1;
            loadScene("d6");
          }
        }
      ]
    },

    d6: {
      image: "assets/d6.png",
      subtitle: "Kapitola 1 – U stolu",
      zones: [
        {
          ...ZONES.CONTINUE_CENTER,
          action: () => {
            loadScene("d9");
          }
        }
      ]
    },

    d7: {
      image: "assets/d7.png",
      subtitle: "Kapitola 1 – Před záchody",
      zones: [
        {
          ...ZONES.CONTINUE_RIGHT,
          action: () => {
            state.independence += 2;
            loadScene("d6");
          }
        }
      ]
    },

    d8: {
      image: "assets/d8.png",
      subtitle: "Kapitola 1 – Konec večera",
      zones: [
        {
          ...ZONES.CONTINUE_CENTER,
          action: () => {
            state.closeness += 1;
            loadScene("d10");
          }
        }
      ]
    },

    d9: {
      image: "assets/d9.png",
      subtitle: "Kapitola 1 – Konec večera",
      zones: [
        {
          ...ZONES.CONTINUE_CENTER,
          action: () => {
            loadScene("d10");
          }
        }
      ]
    },

    d10: {
      image: "assets/d10.png",
      subtitle: "O pár dní později",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.relationship += 2;
            state.trust += 1;
            loadScene("p1");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 1;
            state.independence += 1;
            loadScene("p1");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.independence += 3;
            state.relationship -= 3;
            showEnding(
              "PŘÍBĚH, KTERÝ NEZAČAL",
              "Jarda se ještě chtěl potkat. Ty ses ale rozhodla jinak. První schůzka v Boskovicích se tentokrát nikdy nestala."
            );
          }
        }
      ]
    },


    /* ======================================
       KAPITOLA 2 – POZNÁVÁNÍ SE
    ====================================== */

    p1: {
      image: "assets/p1.png",
      subtitle: "Kapitola 2 – Poznávání se",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.closeness += 1;
            state.trust += 1;
            loadScene("p2");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 1;
            state.independence += 1;
            loadScene("p2");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.closeness += 1;
            state.relationship += 1;
            loadScene("p2");
          }
        }
      ]
    },

    /* ORLEN + KÁVA */
    p2: {
      image: "assets/p2.png",
      subtitle: "Kapitola 2 – ORLEN Boskovice",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.trust += 2;
            state.closeness += 1;
            loadScene("p3");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.closeness += 2;
            state.relationship += 2;
            loadScene("p3");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.independence += 3;
            state.relationship -= 2;
            showEnding(
              "PRVNÍ DOJEM NESTAČIL",
              "Seděli jste spolu v autě na ORLENce, pili kávu a povídali si. Ale už během té schůzky jsi cítila, že z něj necítíš chlapa pro tebe. Nechala ses odvést domů a příběh tady skončil dřív, než se stačil opravdu rozjet."
            );
          }
        }
      ]
    },

    p3: {
      image: "assets/p3.png",
      subtitle: "Kapitola 2 – První opravdová schůzka",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.trust += 2;
            loadScene("p4");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 3;
            state.relationship += 1;
            loadScene("p4");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.closeness += 2;
            state.relationship += 2;
            loadScene("p4");
          }
        }
      ]
    },

    p4: {
      image: "assets/p4.png",
      subtitle: "O pár týdnů později",
      zones: [
        {
          ...ZONES.CONTINUE_CENTER,
          action: () => {
            state.trust += 1;
            loadScene("p5");
          }
        }
      ]
    },

    p5: {
      image: "assets/p5.png",
      subtitle: "Kapitola 2 – Náš malý rituál",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.trust += 1;
            state.closeness += 1;
            loadScene("p6");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.closeness += 2;
            state.relationship += 2;
            loadScene("p6");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.closeness += 3;
            state.relationship += 2;
            loadScene("p6");
          }
        }
      ]
    },

    p6: {
      image: "assets/p6.png",
      subtitle: "Kapitola 2 – Večer ještě nekončí",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.closeness += 2;
            state.relationship += 1;
            loadScene("p7");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.trust += 2;
            state.closeness += 1;
            loadScene("p7");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.relationship += 2;
            state.closeness += 2;
            loadScene("p7");
          }
        }
      ]
    },

    p7: {
      image: "assets/p7.png",
      subtitle: "Kapitola 2 – Noční zastávka",
      zones: [
        {
          ...ZONES.LEFT,
          action: () => {
            state.closeness += 2;
            state.relationship += 1;
            loadScene("p8");
          }
        },
        {
          ...ZONES.MIDDLE,
          action: () => {
            state.closeness += 3;
            state.relationship += 2;
            loadScene("p8");
          }
        },
        {
          ...ZONES.RIGHT,
          action: () => {
            state.trust += 1;
            state.closeness += 2;
            loadScene("p8");
          }
        }
      ]
    },

    p8: {
      image: "assets/p8.png",
      subtitle: "Kapitola 2 – Zamlžená okna",
      zones: [
        {
          ...ZONES.CONTINUE_CENTER,
          action: () => {
            state.closeness += 2;
            state.relationship += 1;
            loadScene("p9");
          }
        }
      ]
    },

    p9: {
      image: "assets/p9.png",
      subtitle: "Konec kapitoly 2",
      zones: [
        {
          ...ZONES.CHAPTER_CENTER,
          action: () => {
            showEnding(
              "KAPITOLA 3 ODEMČENA",
              "Z pravidelných večerů se pomalu stává něco víc. Další kapitola začne prvním společným přespáním v Boskovicích."
            );
          }
        }
      ]
    }

  };


  function applyZoneStyle(element, zone) {
    element.style.left = zone.left + "%";
    element.style.top = zone.top + "%";
    element.style.width = zone.width + "%";
    element.style.height = zone.height + "%";
  }


  function renderZones(zoneList) {
    overlay.innerHTML = "";

    zoneList.forEach(zone => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "zone";

      if (debug) {
        button.classList.add("debug");
      }

      applyZoneStyle(button, zone);
      button.addEventListener("click", zone.action);
      overlay.appendChild(button);
    });
  }


  function loadScene(sceneKey) {
    const scene = scenes[sceneKey];

    if (!scene) {
      console.error("Scéna neexistuje:", sceneKey);
      return;
    }

    currentScene = sceneKey;

    sceneImage.src =
      scene.image + "?v=" + ASSET_VERSION;

    subtitle.textContent =
      scene.subtitle;

    renderZones(scene.zones);
  }


  function showEnding(title, text) {
    endTitle.textContent = title;
    endText.textContent = text;
    endScreen.classList.remove("hidden");
  }


  function restartGame() {
    state.closeness = 0;
    state.trust = 0;
    state.independence = 0;
    state.relationship = 0;

    currentScene = "d1";
    overlay.innerHTML = "";

    sceneImage.src =
      "assets/d1.png?v=" + ASSET_VERSION;

    subtitle.textContent =
      "Kapitola 1 – Dýmkárna";

    endScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }


  document
    .getElementById("startBtn")
    .addEventListener("click", () => {
      startScreen.classList.add("hidden");
      loadScene("d1");
    });


  restartBtn.addEventListener(
    "click",
    restartGame
  );


  closeEndBtn.addEventListener(
    "click",
    () => {
      endScreen.classList.add("hidden");
    }
  );


  function updateDebug() {
    debugBtn.textContent =
      debug
      ? "Debug zóny: zapnuto"
      : "Debug zóny: vypnuto";

    document.querySelectorAll(".zone").forEach(zone => {
      zone.classList.toggle("debug", debug);
    });
  }


  debugBtn.addEventListener(
    "click",
    () => {
      debug = !debug;
      updateDebug();
    }
  );


  document.addEventListener(
    "keydown",
    event => {
      if (event.key.toLowerCase() === "d") {
        debug = !debug;
        updateDebug();
      }
    }
  );


  const imageFiles = [
    "d1.png","d2.png","d3.png","d4.png","d5.png",
    "d6.png","d7.png","d8.png","d9.png","d10.png",
    "p1.png","p2.png","p3.png","p4.png","p5.png",
    "p6.png","p7.png","p8.png","p9.png"
  ];

  imageFiles.forEach(file => {
    const image = new Image();
    image.src = "assets/" + file + "?v=" + ASSET_VERSION;
  });

</script>

</body>
</html>
